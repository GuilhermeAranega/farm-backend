services:
  backend:
    container_name: farm-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - '3333:3333'
    depends_on:
      - db
      - rabbitmq
    networks:
      farm-network:
        ipv4_address: 10.5.0.6

  db:
    container_name: farm-db
    image: mysql/mysql-server:latest
    ports:
      - '3306:3306'
    environment:
      - MYSQL_DATABASE=farm-DB
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
    volumes:
      - mysql-volume:/var/lib/mysql
    networks:
      farm-network:
        ipv4_address: 10.5.0.5

  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: farm-rabbitmq
    ports:
      - "5672:5672" 
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      farm-network:
        ipv4_address: 10.5.0.7
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

  worker_notifications:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: worker_notifications
    depends_on:
        rabbitmq:
          condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://farm-rabbitmq
    networks:
      farm-network:
        ipv4_address: 10.5.0.8
    command: ["node", "/app/workers/notification-worker.js"]

  worker_reports:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: worker_reports
    depends_on:
        rabbitmq:
          condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://farm-rabbitmq
    networks:
      farm-network:
        ipv4_address: 10.5.0.9
    command: ["node", "/app/workers/report-worker.js"]

volumes:
  mysql-volume:
    driver: local

networks:
  farm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1
