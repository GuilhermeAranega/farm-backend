version: '3.8'
services:
  backend:
    container_name: farm-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - '3333:3333'
    depends_on:
      - db
    networks:
      farm-network:
        ipv4_address: 10.5.0.6
  db:
    container_name: farm-db
    image: mysql/mysql-server:latest
    ports:
      - '3306:3306'
    environment:
      - MYSQL_DATABASE=farm-DB
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
    volumes:
      - mysql-volume:/var/lib/mysql
    networks:
      farm-network:
        ipv4_address: 10.5.0.5
volumes:
  mysql-volume:
    driver: local
networks:
  farm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1